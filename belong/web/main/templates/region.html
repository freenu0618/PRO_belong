{% extends "base.html" %}
{% block title %}지역 선택 - Belong{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center" style="margin-top:120px;">

    <div class="card shadow-lg p-4" style="width: 420px; background:#e8f6ff; border-radius:18px;">
        <h4 class="fw-bold mb-3 text-center">지역별 예측</h4>
        <p class="text-muted text-center mb-4">예측할 구와 연도를 입력하세요.</p>

        <form id="region-form">
            <label class="fw-bold">구 이름</label>
            <input type="text" class="form-control mb-3" id="region-input" placeholder="예: 강남구">

            <label class="fw-bold">예측 연도</label>

            <!-- 🔥 수정됨: 입력 가능 연도 범위 제한 -->
            <input type="number"
                   class="form-control mb-3"
                   id="year-input"
                   placeholder="예: 2026"
                   min="2026"
                   max="2035">

            <button type="submit" class="btn btn-primary w-100 mt-3">
                예측하기
            </button>
        </form>

        <p id="region-error" class="mt-3 text-danger fw-bold" style="display:none;"></p>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script>
document.getElementById("region-form").addEventListener("submit", function(e){
    e.preventDefault();

    const region = document.getElementById("region-input").value.trim();
    const yearInput = document.getElementById("year-input");
    let year = parseInt(yearInput.value.trim(), 10);

    // 🔥 입력 가능 범위: 2026 ~ 2035
    if (year < 2026) year = 2026;
    if (year > 2035) year = 2035;

    // 값 보정 후 input에 다시 지정
    yearInput.value = year;

    if (!region || !year) {
        document.getElementById("region-error").innerText = "지역명과 연도를 모두 입력해주세요.";
        document.getElementById("region-error").style.display = "block";
        return;
    }

    // region_detail.html 로 이동
    window.location.href = `/region/${region}?year=${year}`;
});
</script>
{% endblock %}
