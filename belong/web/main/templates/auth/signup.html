{% extends "base.html" %}
{% block title %}회원가입{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 420px;">

    <h3 class="text-center mb-4 fw-bold">회원가입</h3>

    <div id="signup-error" class="alert alert-danger" style="display:none;"></div>

    <form id="signup-form">

        <div class="mb-3">
            <label class="form-label">아이디</label>
            <input type="text" class="form-control" id="username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password1" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">회원가입</button>

        <div class="text-center mt-3">
            <a href="{{ url_for('web.login') }}">로그인</a>
        </div>

    </form>

</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password1").value.trim();

    const errorBox = document.getElementById("signup-error");

    try {
        const res = await fetch("/api/auth/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password })
        });

        const json = await res.json();

        if (!res.ok || json.status !== "success") {
            errorBox.innerText = json.message || "이미 가입된 회원입니다.";
            errorBox.style.display = "block";
            return;
        }

        // ✔ 회원가입 성공 → localStorage에 저장
        localStorage.setItem("belong_user", json.data.username);

        // ✔ 메인 이동
        window.location.href = "{{ url_for('web.index') }}";

    } catch (err) {
        errorBox.innerText = "서버와 연결할 수 없습니다.";
        errorBox.style.display = "block";
    }
});
</script>
{% endblock %}
