{% extends "base.html" %}
{% block title %}회원가입{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 420px;">

    <h3 class="text-center mb-4 fw-bold">회원가입</h3>

    {# 에러 메시지 박스 #}
    <div id="signup-error" class="alert alert-danger" style="display:none;"></div>

    {# 회원가입 성공 팝업 #}
    <div id="signup-success" class="alert alert-success d-flex justify-content-between align-items-center" style="display:none;">
        <span>회원가입이 완료되었습니다.</span>
        <button id="go-login-btn" class="btn btn-sm btn-light">
            로그인하러 가기
        </button>
    </div>

    <form id="signup-form">

        <div class="mb-3">
            <label class="form-label">아이디</label>
            <input type="text" class="form-control" id="username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">비밀번호 확인</label>
            <input type="password" class="form-control" id="password2" required>
            <small id="pw-match-msg" class="fw-bold" style="display:none;"></small>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">회원가입</button>

        <div class="text-center mt-3">
            <a href="{{ url_for('web.login') }}">로그인</a>
        </div>

    </form>

</div>
{% endblock %}

{% block scripts %}
<script>
function checkPasswordMatch() {
    const pw1 = document.getElementById("password1").value;
    const pw2 = document.getElementById("password2").value;
    const msg = document.getElementById("pw-match-msg");

    if (!pw2) {
        msg.style.display = "none";
        return;
    }

    if (pw1 === pw2) {
        msg.style.display = "inline";
        msg.classList.remove("text-danger");
        msg.classList.add("text-success");
        msg.innerText = "비밀번호가 일치합니다.";
    } else {
        msg.style.display = "inline";
        msg.classList.remove("text-success");
        msg.classList.add("text-danger");
        msg.innerText = "비밀번호가 일치하지 않습니다.";
    }
}

document.getElementById("password1").addEventListener("input", checkPasswordMatch);
document.getElementById("password2").addEventListener("input", checkPasswordMatch);

document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password1 = document.getElementById("password1").value.trim();
    const password2 = document.getElementById("password2").value.trim();

    const errorBox = document.getElementById("signup-error");
    const successBox = document.getElementById("signup-success");
    const pwMsg = document.getElementById("pw-match-msg");

    // 이전 상태 초기화
    errorBox.style.display = "none";
    successBox.style.display = "none";

    // ✅ 프론트에서 비밀번호 일치 여부 먼저 검증
    if (!password1 || !password2) {
        errorBox.innerText = "비밀번호를 모두 입력해주세요.";
        errorBox.style.display = "block";
        return;
    }

    if (password1 !== password2) {
        errorBox.innerText = "비밀번호가 서로 일치하지 않습니다.";
        errorBox.style.display = "block";

        pwMsg.style.display = "inline";
        pwMsg.classList.remove("text-success");
        pwMsg.classList.add("text-danger");
        pwMsg.innerText = "비밀번호가 일치하지 않습니다.";

        return;
    }

    try {
        const res = await fetch("/api/auth/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password: password1 })
        });

        const json = await res.json();

        if (!res.ok || json.status !== "success") {
            errorBox.innerText = json.message || "이미 가입된 회원입니다.";
            errorBox.style.display = "block";
            return;
        }

        // ✅ 회원가입 성공: 성공 배너만 띄우고, 자동 로그인은 안 함
        successBox.style.display = "flex";

        // 입력 비활성화 (선택 사항)
        document.getElementById("username").disabled = true;
        document.getElementById("email").disabled = true;
        document.getElementById("password1").disabled = true;
        document.getElementById("password2").disabled = true;

    } catch (err) {
        console.error(err);
        errorBox.innerText = "서버와 연결할 수 없습니다.";
        errorBox.style.display = "block";
    }
});

// '로그인하러 가기' 버튼
document.addEventListener("DOMContentLoaded", () => {
    const goLoginBtn = document.getElementById("go-login-btn");
    if (goLoginBtn) {
        goLoginBtn.addEventListener("click", () => {
            window.location.href = "{{ url_for('web.login') }}";
        });
    }
});
</script>
{% endblock %}
