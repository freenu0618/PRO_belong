{% extends "base.html" %}
{% block title %}로그인{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 420px;">

    <h3 class="text-center mb-4 fw-bold">로그인</h3>

    <div id="login-error" class="alert alert-danger" style="display:none;"></div>

    <form id="login-form">
        <div class="mb-3">
            <label class="form-label">아이디</label>
            <input type="text" class="form-control" id="username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">로그인</button>

        <div class="text-center mt-3">
            <a href="{{ url_for('web.signup') }}">회원가입</a>
        </div>
    </form>

</div>

{% endblock %}

{% block scripts %}
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorBox = document.getElementById("login-error");

    try {
        const res = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const json = await res.json();

        if (!res.ok || json.status !== "success") {
            errorBox.innerText = json.message || "아이디 또는 비밀번호가 올바르지 않습니다.";
            errorBox.style.display = "block";
            return;
        }

        // ✔ 로그인 성공 → localStorage 저장
        localStorage.setItem("belong_user", json.data.username);

        // ✔ 메인 페이지 이동
        window.location.href = "{{ url_for('web.index') }}";

    } catch (err) {
        errorBox.innerText = "서버와 연결할 수 없습니다.";
        errorBox.style.display = "block";
    }
});
</script>
{% endblock %}
