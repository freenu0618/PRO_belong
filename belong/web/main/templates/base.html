<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Belong{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

    <!-- Global style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    {% include 'navbar.html' %}

    <!-- fixed navbar 공간 확보 -->
    <main style="margin-top: 70px;">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4">
        <small>Belong Project © 2025</small>
    </footer>

    <!-- JS (의존성 먼저, 우리 코드 나중) -->
    <script src="{{ url_for('static', filename='js/jquery-3.7.1.min.js') }}"></script>

    <!-- 🔁 여기만 수정: bootstrap.min.js → bootstrap.bundle.min.js -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

    <script src="{{ url_for('static', filename='js/chart.min.js') }}"></script>

    <!-- 상관관계 지도 스크립트 -->
    <script src="{{ url_for('static', filename='charts/correlation_map.js') }}"></script>

    {# <script src="{{ url_for('static', filename='css/main.js') }}"></script> #}

    {% block scripts %}{% endblock %}
</body>
</html>
