<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Belong{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

    <!-- Global style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    {# ===============================
       공통 헤더(네비 + 배경) 블록
       - 기본: 평범한 어두운 바(홈에서 사용)
       - 서브페이지: 각 템플릿에서 hero-header로 오버라이드
       =============================== #}
    {% block header %}
    <header class="belong-header-default">
        {% include 'navbar.html' %}
    </header>
    {% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4">
        <small>Belong Project © 2025</small>
    </footer>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/jquery-3.7.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chart.min.js') }}"></script>

    <!-- 상관관계 페이지 지도 JS -->
    <script src="{{ url_for('static', filename='charts/correlation_map.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
