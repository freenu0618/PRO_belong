{% extends "base.html" %}

{% block content %}
<div class="corr-page">

    <!-- ===== 1페이지: 지도 섹션 ===== -->
    <section class="corr-hero">
        <div class="container mt-2 my-4">
            <h3 class="mb-3">서울시 구별 상관관계 분석</h3>

            <div class="d-flex justify-content-center">
                <!-- 지도 프레임 -->
                <div class="map-frame">
                    <div id="map-container">
                        <div id="map-inner">
                            {% include "partials/seoul_map.svg" %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== 2페이지: 연도/구 선택 + 그래프/테이블 섹션 ===== -->
    <section id="corr-section" class="corr-detail-section">
        <div class="container">

            <!-- 2-1. 필터 UI -->
            <h5 class="mb-3">연도 범위 및 구 선택</h5>

            <form id="corrFilterForm" class="row g-2 align-items-center mb-3">
                <!-- 구 선택 (텍스트 + 자동완성) -->
                <div class="col-auto">
                    <label for="corrGuInput" class="col-form-label small">자치구</label>
                </div>
                <div class="col-auto">
                    <input
                        id="corrGuInput"
                        class="form-control form-control-sm"
                        list="corrGuOptions"
                        placeholder="예: 도봉구 (비우면 전체)"
                    >
                    <datalist id="corrGuOptions">
                        <option value="강남구">
                        <option value="강동구">
                        <option value="강북구">
                        <option value="강서구">
                        <option value="관악구">
                        <option value="광진구">
                        <option value="구로구">
                        <option value="금천구">
                        <option value="노원구">
                        <option value="도봉구">
                        <option value="동대문구">
                        <option value="동작구">
                        <option value="마포구">
                        <option value="서대문구">
                        <option value="서초구">
                        <option value="성동구">
                        <option value="성북구">
                        <option value="송파구">
                        <option value="양천구">
                        <option value="영등포구">
                        <option value="용산구">
                        <option value="은평구">
                        <option value="종로구">
                        <option value="중구">
                        <option value="중랑구">
                    </datalist>
                </div>

                <!-- 시작 연도 (number input) -->
                <div class="col-auto">
                    <label for="corrStartYear" class="col-form-label small">시작 연도</label>
                </div>
                <div class="col-auto">
                    <input
                        type="number"
                        id="corrStartYear"
                        class="form-control form-control-sm"
                        min="2000"
                        max="2100"
                        value="2017"
                        placeholder="예: 2017"
                    >
                </div>

                <!-- 종료 연도 (number input) -->
                <div class="col-auto">
                    <label for="corrEndYear" class="col-form-label small">종료 연도</label>
                </div>
                <div class="col-auto">
                    <input
                        type="number"
                        id="corrEndYear"
                        class="form-control form-control-sm"
                        min="2000"
                        max="2100"
                        value="2023"
                        placeholder="예: 2023"
                    >
                </div>

                <!-- 적용 버튼 -->
                <div class="col-auto">
                    <button type="button" id="corrApplyBtn" class="btn btn-sm btn-primary">
                        적용
                    </button>
                </div>
            </form>

            <!-- 2-2. 막대 그래프 2개 -->
            <div class="row mb-4">
                <div class="col-md-6" style="height: 260px;">
                    <h6 class="small text-muted mb-1">영향력 (표준화 계수 β)</h6>
                    <canvas id="corrCoefChart"></canvas>
                </div>

                <div class="col-md-6 mt-4 mt-md-0" style="height: 260px;">
                    <h6 class="small text-muted mb-1">VIF (다중공선성)</h6>
                    <canvas id="corrVifChart"></canvas>
                </div>
            </div>

            <!-- 2-3. 테이블 -->
            <div class="table-responsive" style="max-height: 260px; overflow-y:auto;">
                <table class="table table-sm table-striped align-middle mb-0" id="corrSummaryTable">
                    <thead class="table-light">
                        <tr>
                            <th>지표</th>
                            <th>corr</th>
                            <th>β (coef_std)</th>
                            <th>VIF</th>
                            <th>선택</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- 2-4. 자동 요약 문구 -->
            <div class="mt-3">
                <h6 class="small text-muted mb-1">요약</h6>
                <p class="mb-0 small" id="corrSummaryText">
                    연도와 구를 선택한 뒤 [적용] 버튼을 눌러 상관관계 분석을 확인해 보세요.
                </p>
            </div>
        </div>
    </section>

    <!-- 히트맵 모달 (지도 클릭용) -->
    <div class="modal fade" id="corrModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="corrModalLabel">상관관계 히트맵</h5>
                    <button
                        type="button"
                        class="btn-close"
                        id="corrModalClose"
                        data-bs-dismiss="modal"
                        aria-label="닫기">
                    </button>
                </div>
                <div class="modal-body" style="height: 400px;">
                    <canvas id="corrHeatmapCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
    {{ super() }}
    <script src="{{ url_for('static', filename='charts/correlation_chart.js') }}"></script>
{% endblock %}
