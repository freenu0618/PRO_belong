{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <h3 class="mb-3">서울시 구별 상관관계 분석</h3>

    <div class="d-flex justify-content-center">
        <!-- 지도 프레임 -->
        <div class="map-frame">
            <!-- 이 id 두 개가 JS랑 반드시 같아야 함 -->
            <div id="map-container">
                <div id="map-inner">
                    {% include "partials/seoul_map.svg" %}
                </div>
            </div>
        </div>
    </div>

    <!-- 상관관계 히트맵 모달 -->
    <div class="modal fade" id="corrModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="corrModalLabel">상관관계 히트맵</h5>
                      <!-- ✅ 닫기 버튼: Bootstrap 5 + 우리가 직접 JS로도 hide 호출 -->
                    <button type="button"
                            class="btn-close"
                            id="corrModalClose"
                            data-bs-dismiss="modal"
                            aria-label="닫기"></button>
                </div>
                <div class="modal-body" style="height: 400px;">
                    <canvas id="corrHeatmapCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
