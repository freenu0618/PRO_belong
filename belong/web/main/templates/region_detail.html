{% extends "base.html" %}
{% block title %}{{ region }} 예측 결과{% endblock %}

{% block content %}

<div class="container mt-4">

    <!-- 제목 -->
    <h2 class="fw-bold">{{ region }} 예측 결과</h2>
    <p class="text-muted">예측 연도: {{ year }}</p>

    <!-- 로딩 -->
    <div id="loading" class="text-center my-5" style="display:none;">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2 fw-bold">데이터 불러오는 중...</p>
    </div>

    <!-- 오류 메시지 -->
    <div id="error-message" class="alert alert-danger" style="display:none;"></div>

    <!-- 예측 요약 카드 -->
    <div id="summary-section" style="display:none;">
        <div class="row g-3">

            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <small class="text-muted">최신 노인 인구</small>
                    <h3 id="latest-pop" class="fw-bold mb-0">-</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <small class="text-muted">예측값 ({{ year }})</small>
                    <h3 id="predicted-pop" class="fw-bold mb-0">-</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm p-3">
                    <small class="text-muted">증가율</small>
                    <h3 id="growth-rate" class="fw-bold mb-0">-</h3>
                </div>
            </div>

        </div>
    </div>

    <!-- 차트 표시 버튼 -->
    <div class="text-center mt-5" id="chart-btn-section" style="display:none;">
        <button class="btn btn-info btn-lg" data-bs-toggle="modal" data-bs-target="#forecastModal">
            예측 차트 보기
        </button>
    </div>

</div>


<!-- 예측 차트 팝업 Modal -->
<div class="modal fade" id="forecastModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">{{ region }} 예측 차트</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
          <canvas id="forecast-chart" height="150"></canvas>
      </div>

    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='charts/region_predict.js') }}"></script>
<script>
    loadRegionForecast("{{ region }}", "{{ year }}");
</script>
{% endblock %}
