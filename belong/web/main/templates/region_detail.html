{% extends "base.html" %}
{% block content %}

<h1>{{ region }} 상세 분석</h1>

<!-- 지역 선택 UI -->
<select id="regionSelect" class="form-select" style="width:200px;">
    <option value="강남구">강남구</option>
    <option value="종로구">종로구</option>
    <option value="동작구">동작구</option>
</select>

<!-- 예측 실행 버튼 -->
<button id="predict-btn" class="btn btn-primary mt-2">예측 실행</button>

<!-- 로딩 표시 -->
<div id="loading" style="display:none" class="mt-3">
    ⏳ 분석 중...
</div>

<!-- 에러 메시지 영역 -->
<div id="error-message" class="text-danger mt-2" style="display:none"></div>

<!-- 차트 영역 -->
<div class="border p-4 bg-light text-center mt-3">
    <canvas id="forecastChart" width="600" height="300"></canvas>
</div>

<!-- 차트/예측 스크립트 -->
<script src="{{ url_for('static', filename='js/charts/forecast_chart.js') }}"></script>

<!-- 버튼 이벤트 연결 -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const button = document.getElementById("predict-btn");
        const select = document.getElementById("regionSelect");

        button.addEventListener("click", () => {
            const region = select.value;
            hideError();
            updateForecastChart(region);
        });

        // (선택) 페이지 처음 로드 시 기본 지역 한 번 바로 조회
        // hideError();
        // updateForecastChart(select.value);
    });
</script>

{% endblock %}
