{% extends "base.html" %}
{% block title %}지역 예측 결과{% endblock %}

{% block content %}

<div class="container py-4">

    <!-- 지역명 타이틀 -->
    <h2 class="fw-bold mb-4">{{ region }} 예측 결과</h2>

    <!-- 로딩 / 에러 메시지 -->
    <div id="loading" class="alert alert-info" style="display:none;">불러오는 중...</div>
    <div id="error-message" class="alert alert-danger" style="display:none;"></div>

    <!-- ✔ Summary 카드 3개 -->
    <div class="row g-3 mb-4" id="summary-section" style="display:none;">
        <div class="col-md-4">
            <div class="card l-bg-blue-dark p-3 text-white shadow-sm">
                <h6>최신 인구</h6>
                <h3 id="latest-value">-</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card l-bg-green-dark p-3 text-white shadow-sm">
                <h6>증가율</h6>
                <h3 id="growth-rate">-</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card l-bg-orange-dark p-3 text-white shadow-sm">
                <h6>예측 요약</h6>
                <h3 id="forecast-summary">-</h3>
            </div>
        </div>
    </div>

    <!-- ✔ 차트 -->
    <div class="card shadow-sm mb-4" id="chart-section" style="display:none;">
        <div class="card-body">
            <h5 class="fw-bold mb-3">{{ region }} 인구 추세</h5>
            <canvas id="forecast-chart" height="130"></canvas>
        </div>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='charts/region_predict.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const region = "{{ region }}";
    updateForecastChart(region);
});
</script>
{% endblock %}
