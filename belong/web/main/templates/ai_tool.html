{# templates/ai/ai_tool.html #}
{% extends "base.html" %}
{% block title %}{{ page_title }} - Belong{% endblock %}

{% block content %}
<div class="container py-5">

  <div class="row justify-content-center">
    <div class="col-lg-8">

      <h1 class="mb-2">{{ heading }}</h1>
      <p class="text-muted mb-4">{{ description }}</p>

      <div class="card shadow-sm">
        <div class="card-body">

          <div class="mb-3">
            <label class="form-label">입력 텍스트</label>
            <textarea id="ai-input-text"
                      class="form-control"
                      rows="6"
                      placeholder="분석하거나 번역할 문장을 입력해주세요."></textarea>
          </div>

          <button id="ai-run-btn"
                  class="btn btn-primary"
                  data-service="{{ service_name }}">
            실행
          </button>

          <hr>

          <h6 class="text-muted">결과</h6>
          <pre id="ai-result"
               class="small border rounded p-2"
               style="min-height: 80px; white-space: pre-wrap; word-break: break-word;"></pre>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script src="{{ url_for('static', filename='js/ai_page.js') }}"></script>
{% endblock %}
