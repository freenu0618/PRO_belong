                 alt="Belong Logo"
                 style="height:40px; border-radius:8px; margin-right:10px;">
            <span style="font-size:22px;">Belong</span>
        </a>

        <!-- 모바일 햄버거 버튼 -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- 메뉴 -->
        <div class="collapse navbar-collapse bg-dark" id="navbarNav">

            <!-- 가운데 메뉴 -->
            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link nav-link-lg" href="{{ url_for('web.index') }}">홈</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link nav-link-lg" href="{{ url_for('web.dashboard') }}">대시보드</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link nav-link-lg" href="{{ url_for('web.region') }}">지역별 예측</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link nav-link-lg" href="{{ url_for('web.correlation') }}">상관관계 분석</a>
                </li>

            </ul>

            <!-- 오른쪽 로그인/회원가입 -->
            <ul class="navbar-nav">

                <!-- 비로그인 -->
                <li class="nav-item" id="nav-login-link">
                    <a class="nav-link nav-link-lg" href="{{ url_for('web.login') }}">로그인</a>
                </li>
                <li class="nav-item" id="nav-signup-link">
                    <a class="nav-link nav-link-lg" href="{{ url_for('web.signup') }}">회원가입</a>
                </li>

                <!-- 로그인 상태 -->
                <li class="nav-item d-none" id="nav-username">
                    <span class="nav-link nav-link-lg text-primary fw-bold"></span>
                </li>

                <li class="nav-item">
                    <button id="logoutBtn"
                            class="btn btn-outline-primary btn-sm ms-2 d-none">

<style>
    /* PC 모드 전용 메뉴 글씨 색 */
    .nav-link-lg {
        font-size: 17px;
        font-weight: 600;
        padding: 8px 16px !important;
        color: #f1f1f1 !important;  /* PC에서도 white */
        transition: color .2s ease;
    }
    .nav-link-lg:hover {
        color: #66a2ff !important;
    }

    /* 모바일에서 collapse 배경 유지 */
    .navbar-collapse {
        background-color: #212529 !important;
        padding: 10px;
    }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const user = localStorage.getItem("belong_user");

    const navLogin   = document.getElementById("nav-login-link");
    const navSignup  = document.getElementById("nav-signup-link");
    const navUser    = document.getElementById("nav-username");
    const logoutBtn  = document.getElementById("logoutBtn");

    if (user) {
        navLogin?.classList.add("d-none");
        navSignup?.classList.add("d-none");

        if (navUser) {
            navUser.classList.remove("d-none");
            navUser.querySelector("span").innerText = `${user}님 환영합니다`;
        }
        logoutBtn?.classList.remove("d-none");

        logoutBtn?.addEventListener("click", () => {
            localStorage.removeItem("belong_user");
            window.location.reload();
        });

    } else {
        navLogin?.classList.remove("d-none");
        navSignup?.classList.remove("d-none");
        navUser?.classList.add("d-none");
        logoutBtn?.classList.add("d-none");
    }
});
</script>
