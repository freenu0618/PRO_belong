{% extends "base.html" %}
{% block title %}Belong - Dashboard{% endblock %}

{% block content %}
<div class="container py-4">

    <!-- Summary Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <small class="text-muted">총 독거노인 수</small>
                    <h3 id="summary-total" class="fw-bold mb-0">-</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <small class="text-muted">증가 TOP 구</small>
                    <h4 id="summary-growth-top" class="fw-bold mb-0">-</h4>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <small class="text-muted">감소 TOP 구</small>
                    <h4 id="summary-growth-bottom" class="fw-bold mb-0">-</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart Section -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="fw-bold mb-3">서울 25개 구 추세 미리보기</h5>
            <canvas id="dashboard-chart" height="140"></canvas>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="fw-bold mb-3">구별 최신 데이터</h5>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>구</th>
                            <th>최신 인구</th>
                            <th>증가율</th>
                            <th>상세보기</th>
                        </tr>
                    </thead>

                    <tbody id="population-table-body">
                        <!-- dashboard.js 렌더링 영역 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='charts/dashboard.js') }}"></script>
{% endblock %}
