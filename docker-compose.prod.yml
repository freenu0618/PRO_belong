version: '3.8'

services:
  # 1. Web Service (Flask)
  web:
    image: freenu0618/belong-web:latest
    container_name: belong-web
    restart: always
    ports:
      - "5000:5000" # RunPod HTTP Port
    environment:
      - APP_ENV=production
      - RUNPOD_ENDPOINT_URL=http://194.68.245.66:22109/generate # AI Pod IP (Check again!)
      - ORACLE_DSN=db:1521/xe
      - ORACLE_USER=system
      - ORACLE_PASSWORD=oracle
    depends_on:
      - db

  # 2. Database Service (Oracle 11g XE)
  db:
    image: gvenzl/oracle-xe:11
    container_name: belong-db
    restart: always
    environment:
      - ORACLE_PASSWORD=oracle
    volumes:
      - oracle_data:/opt/oracle/oradata # Data Persistence

volumes:
  oracle_data:
